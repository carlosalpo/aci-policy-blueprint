[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aci-policy-blueprint"
version = "0.1.0"
description = "Compile explicit application flows into reviewable Cisco ACI policy blueprints."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Carlos Alvarado"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
aci-blueprint = "aci_blueprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
